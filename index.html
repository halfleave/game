<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>宝宝游戏屋 🏠</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  html, body { width: 100%; height: 100%; overflow: hidden; position: fixed; }
  body {
    font-family: "PingFang SC", "Hiragino Sans GB", sans-serif;
    touch-action: none; overscroll-behavior: none;
    background: #F2EFE9;   /* 兜底色 */
  }

  /* 全屏背景层（iPad Safari 不渲染 body 渐变，用独立层） */
  #bg {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background: linear-gradient(180deg, #FBEFE0 0%, #F7ECE9 55%, #EAF1EA 100%);
  }

  /* 漂浮的装饰 emoji */
  .float {
    position: absolute; z-index: 1; pointer-events: none; opacity: .8;
    animation: floaty linear infinite;
  }
  @keyframes floaty {
    from { transform: translateY(0) rotate(-6deg); }
    50%  { transform: translateY(-18px) rotate(6deg); }
    to   { transform: translateY(0) rotate(-6deg); }
  }

  #wrap {
    position: relative; z-index: 5;
    height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: clamp(20px, 4vh, 36px);
    padding: max(20px, env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom));
  }

  h1 {
    font-size: clamp(34px, 8vw, 60px); color: #B25D7E;
    text-shadow: 0 3px 0 #fff;
    letter-spacing: 2px;
  }

  /* 游戏入口卡片 */
  .cards {
    display: flex; gap: clamp(16px, 4vw, 36px);
    flex-wrap: wrap; justify-content: center;
  }
  a.card {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; text-decoration: none;
    width: clamp(150px, 34vw, 240px);
    height: clamp(150px, 34vw, 240px);
    border-radius: 36px;
    color: #5A4632; font-weight: 800;
    box-shadow: 0 10px 28px rgba(90,70,50,.12);
    transition: transform .15s ease;
    cursor: pointer;
  }
  a.card:active { transform: scale(.95); }
  .card .icon { font-size: clamp(52px, 12vw, 84px); line-height: 1; }
  .card .name { font-size: clamp(20px, 4.5vw, 28px); }
  .card .tag  { font-size: clamp(12px, 2.5vw, 15px); font-weight: 600; opacity: .65; }

  .card.bubble  { background: linear-gradient(160deg, #E8F4FB 0%, #DDF0E6 100%); }
  .card.mole    { background: linear-gradient(160deg, #FDF0E4 0%, #FBE4E0 100%); }
  .card.egg     { background: linear-gradient(160deg, #EFF5E4 0%, #E4F0DC 100%); }
  .card.fish    { background: linear-gradient(160deg, #E3F2F8 0%, #DCEBF6 100%); }

  /* 家长提示 */
  .tip {
    font-size: clamp(13px, 2.8vw, 16px); color: #9B8B76;
    background: rgba(255,255,255,.75);
    padding: 8px 20px; border-radius: 999px;
  }
</style>
</head>
<body>

<div id="bg"></div>

<!-- 漂浮装饰 -->
<div class="float" style="left:8%;  top:12%; font-size:40px; animation-duration:4s;">🫧</div>
<div class="float" style="left:85%; top:16%; font-size:36px; animation-duration:5s;">🎈</div>
<div class="float" style="left:12%; top:70%; font-size:34px; animation-duration:6s;">🌸</div>
<div class="float" style="left:82%; top:64%; font-size:38px; animation-duration:4.5s;">⭐</div>
<div class="float" style="left:48%; top:8%;  font-size:30px; animation-duration:7s;">☁️</div>

<div id="wrap">
  <h1>🏠 宝宝游戏屋</h1>

  <div class="cards">
    <a class="card bubble" href="bubble.html">
      <div class="icon">🫧</div>
      <div class="name">戳泡泡</div>
      <div class="tag">点一点 · 啵啵啵</div>
    </a>

    <a class="card mole" href="mole.html">
      <div class="icon">🐿️</div>
      <div class="name">动物地鼠</div>
      <div class="tag">谁在探头？点它！</div>
    </a>

    <a class="card egg" href="egg.html">
      <div class="icon">🥚</div>
      <div class="name">恐龙蛋</div>
      <div class="tag">敲一敲 · 破壳啦</div>
    </a>

    <a class="card fish" href="fish.html">
      <div class="icon">🐟</div>
      <div class="name">捞小鱼</div>
      <div class="tag">点一点 · 网住它</div>
    </a>
  </div>

  <div class="tip">👨‍👩‍👧 给家长：点卡片进游戏 · 建议横竖屏都可以玩</div>
</div>

<script>
// 空着：所有卡片都已可点
</script>
</body>
</html>
