<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<title>戳泡泡 🫧 宝宝的游戏</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  html, body { width: 100%; height: 100%; overflow: hidden; position: fixed; }
  body {
    background: linear-gradient(180deg, #DFEDF6 0%, #F2EFE9 58%, #FAF1E5 100%);
    font-family: "PingFang SC", "Hiragino Sans GB", sans-serif;
    cursor: pointer;
    touch-action: none;
    overscroll-behavior: none;
  }

  /* 天上的云朵装饰 */
  .cloud {
    position: absolute;
    background: rgba(255,255,255,.7);
    border-radius: 100px;
    pointer-events: none;
    z-index: 1;
  }
  .cloud::before, .cloud::after {
    content: ""; position: absolute; background: inherit; border-radius: 50%;
  }
  .cloud::before { width: 55%; height: 150%; left: 12%; top: -55%; }
  .cloud::after  { width: 40%; height: 120%; right: 12%; top: -40%; }
  @keyframes drift { from { transform: translateX(-30vw); } to { transform: translateX(120vw); } }

  /* 地上的草地 */
  #ground {
    position: fixed; bottom: 0; left: 0; width: 100%; height: 12vh;
    background: linear-gradient(180deg, #C4E3B2 0%, #ABD29B 100%);
    z-index: 2;
  }

  /* 泡泡 */
  .bubble {
    position: absolute;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    z-index: 5;
    cursor: pointer;
    background:
      radial-gradient(circle at 30% 28%, rgba(255,255,255,.95) 0 12%, rgba(255,255,255,.35) 14% 22%, transparent 26%),
      radial-gradient(circle at 68% 75%, rgba(255,255,255,.25) 0 10%, transparent 14%);
    box-shadow: inset -6px -8px 18px rgba(255,255,255,.55), 0 6px 16px rgba(0,0,0,.08);
    animation: rise linear forwards;
  }
  @keyframes rise {
    from { transform: translateY(0) translateX(0); }
    to   { transform: translateY(calc(-115vh)) translateX(var(--sway, 20px)); }
  }
  .bubble .face { line-height: 1; filter: drop-shadow(0 2px 2px rgba(0,0,0,.1)); pointer-events: none; }

  /* 爆开动画 */
  @keyframes pop {
    0%   { transform: scale(1); opacity: 1; }
    60%  { transform: scale(1.45); opacity: .9; }
    100% { transform: scale(1.9); opacity: 0; }
  }
  .bubble.pop { animation: pop .3s ease-out forwards !important; pointer-events: none; }

  /* 星星碎片 */
  .spark {
    position: absolute; z-index: 6; pointer-events: none;
    animation: spark .8s ease-out forwards;
  }
  @keyframes spark {
    from { transform: translate(0,0) scale(1); opacity: 1; }
    to   { transform: translate(var(--dx), var(--dy)) scale(.4); opacity: 0; }
  }

  /* 鼓励词 */
  .praise {
    position: absolute; z-index: 7; pointer-events: none;
    font-weight: 800;
    color: #FF7BA9;
    text-shadow: 0 2px 0 #fff, 0 4px 10px rgba(0,0,0,.12);
    animation: praiseUp 1.1s ease-out forwards;
    white-space: nowrap;
  }
  @keyframes praiseUp {
    from { transform: translate(-50%, 0) scale(.5); opacity: 0; }
    30%  { transform: translate(-50%, -16px) scale(1.2); opacity: 1; }
    to   { transform: translate(-50%, -80px) scale(1); opacity: 0; }
  }

  /* 点空白的涟漪 */
  .ripple {
    position: absolute; z-index: 4; pointer-events: none;
    border-radius: 50%;
    border: 4px solid rgba(255,255,255,.9);
    background: rgba(255,255,255,.25);
    animation: ripple .5s ease-out forwards;
  }
  @keyframes ripple {
    from { transform: scale(.2); opacity: 1; }
    to   { transform: scale(1); opacity: 0; }
  }

  /* 顶栏 */
  #hud {
    position: fixed; top: 14px; left: 0; width: 100%;
    display: flex; justify-content: center; gap: 16px;
    z-index: 20; pointer-events: none;
    padding-top: env(safe-area-inset-top);
  }
  #hud .pill {
    pointer-events: auto;
    background: rgba(255,255,255,.85);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border-radius: 999px; padding: 12px 26px;
    font-size: 26px; font-weight: 700; color: #5A4632;
    box-shadow: 0 4px 12px rgba(0,0,0,.1);
    border: none; font-family: inherit;
  }
  .pill:active { transform: scale(.94); }
  #scorePill.bump { animation: bump .35s ease-out; }
  @keyframes bump { 40% { transform: scale(1.3); } }

  /* 暂停时冻结所有动画 */
  body.paused * { animation-play-state: paused !important; }

  /* 暂停遮罩 */
  #pauseOverlay {
    position: fixed; inset: 0; z-index: 15;
    background: rgba(250,247,242,.78);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    display: none; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    cursor: pointer;
  }
  #pauseOverlay .big { font-size: clamp(60px, 14vw, 100px); animation: bob 1.8s ease-in-out infinite; }
  #pauseOverlay p { font-size: clamp(22px, 4.5vw, 30px); color: #7A6A55; font-weight: 700; }

  /* 结算页 */
  #endOverlay {
    position: fixed; inset: 0; z-index: 45;
    background: rgba(250,247,242,.88);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    display: none; align-items: center; justify-content: center;
    padding: 24px;
  }
  #endOverlay .card {
    background: rgba(255,255,255,.94);
    border-radius: 36px;
    padding: clamp(28px, 6vw, 48px) clamp(36px, 8vw, 64px);
    box-shadow: 0 14px 44px rgba(90,70,50,.10);
    display: flex; flex-direction: column; align-items: center; gap: 16px;
  }
  #endOverlay h2 { font-size: clamp(32px, 7vw, 52px); color: #E88CA8; }
  #endOverlay .stars { font-size: clamp(38px, 9vw, 62px); }
  #endOverlay .num { font-size: clamp(26px, 5.5vw, 40px); color: #5A4632; font-weight: 800; }
  #againBtn {
    font-size: clamp(22px, 4.5vw, 28px) !important;
    padding: 16px 44px !important;
    background: #F9DCE6 !important;
    color: #B25D7E !important;
    border: none; border-radius: 999px; font-weight: 700; font-family: inherit;
    box-shadow: 0 6px 16px rgba(232,140,168,.25);
  }
  #againBtn:active { transform: scale(.95); }

  /* 小屏时顶栏紧凑一些 */
  @media (max-width: 520px) {
    #hud { gap: 8px; }
    #hud .pill { font-size: 17px; padding: 8px 14px; }
  }

  /* 开始遮罩 */
  #start {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(255,255,255,.6);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px;
    cursor: pointer;
    padding: 24px; text-align: center;
  }
  #start h1 { font-size: clamp(40px, 9vw, 72px); color: #FF7BA9; text-shadow: 0 3px 0 #fff; }
  #start p { font-size: clamp(20px, 4.5vw, 30px); color: #5A4632; }
  #start .hint { font-size: clamp(15px, 3vw, 19px); color: #9B8B76; }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
  #start .demo { font-size: clamp(60px, 14vw, 100px); animation: bob 1.6s ease-in-out infinite; }
</style>
</head>
<body>

<div id="ground"></div>

<div id="hud">
  <div class="pill" id="scorePill">⭐ <span id="score">0</span></div>
  <div class="pill" id="timerPill">⏱ <span id="timer">180</span></div>
  <button class="pill" id="pauseBtn" title="暂停">⏸</button>
  <button class="pill" id="musicBtn" title="音乐开关">🎵 开</button>
  <button class="pill" id="fullscreenBtn" title="全屏">⛶ 全屏</button>
</div>

<div id="pauseOverlay">
  <div class="big">⏸️</div>
  <p>休息一下～</p>
  <p>点这里继续玩</p>
</div>

<div id="endOverlay">
  <div class="card">
    <h2>时间到！</h2>
    <div class="stars" id="endStars">⭐⭐⭐</div>
    <div class="num">你戳了 <span id="finalScore">0</span> 个泡泡，真棒！</div>
    <button class="pill" id="againBtn">▶ 再玩一次</button>
  </div>
</div>

<div id="start">
  <div class="demo">🫧 👶</div>
  <h1>戳泡泡</h1>
  <p>点一下泡泡，啵~ 就爆开啦！</p>
  <p class="hint">点这里开始 · 手机和平板都能玩 · 横屏竖屏都可以</p>
</div>

<script>
// ---------- 基础 ----------
const start = document.getElementById('start');
const scoreEl = document.getElementById('score');
const scorePill = document.getElementById('scorePill');
let started = false, score = 0;

// 阻止平板上的双指缩放 / 长按菜单 / 下拉滚动
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault());

start.addEventListener('pointerdown', () => {
  if (started) return;
  started = true;
  start.style.display = 'none';
  initAudio();
  startMusic();
  setInterval(spawnBubble, 850);
  spawnBubble(); spawnBubble(); spawnBubble();
}, { once: true });

// 全屏（平板上很实用）
document.getElementById('fullscreenBtn').addEventListener('pointerdown', () => {
  if (!document.fullscreenElement) {
    (document.documentElement.requestFullscreen?.() || Promise.reject()).catch(()=>{});
  } else document.exitFullscreen();
});

// ---------- 暂停 ----------
const pauseBtn = document.getElementById('pauseBtn');
const pauseOverlay = document.getElementById('pauseOverlay');
let paused = false, gameOver = false, timeLeft = 180;

function setPaused(v) {
  if (gameOver) return;
  paused = v;
  document.body.classList.toggle('paused', paused);
  pauseOverlay.style.display = paused ? 'flex' : 'none';
  pauseBtn.textContent = paused ? '▶' : '⏸';
}
pauseBtn.addEventListener('pointerdown', () => setPaused(!paused));
pauseOverlay.addEventListener('pointerdown', () => setPaused(false));

// ---------- 3 分钟倒计时 ----------
const timerEl = document.getElementById('timer');
function updateTimer() {
  timerEl.textContent = timeLeft;
}
setInterval(() => {
  if (!started || paused || gameOver || timeLeft <= 0) return;
  timeLeft--;
  updateTimer();
  if (timeLeft <= 0) endGame();
}, 1000);

function endGame() {
  gameOver = true;
  document.body.classList.add('paused');   // 冻结所有泡泡
  const stars = score >= 20 ? '⭐⭐⭐⭐⭐' : score >= 12 ? '⭐⭐⭐⭐' : score >= 6 ? '⭐⭐⭐' : score >= 2 ? '⭐⭐' : '⭐';
  document.getElementById('endStars').textContent = stars;
  document.getElementById('finalScore').textContent = score;
  document.getElementById('endOverlay').style.display = 'flex';
  pauseBtn.textContent = '⏸';
}

// 再玩一次
document.getElementById('againBtn').addEventListener('pointerdown', e => {
  e.stopPropagation();
  score = 0; scoreEl.textContent = '0';
  timeLeft = 180; updateTimer();
  document.querySelectorAll('.bubble').forEach(b => b.remove());
  paused = false; gameOver = false;
  document.body.classList.remove('paused');
  pauseOverlay.style.display = 'none';
  document.getElementById('endOverlay').style.display = 'none';
});

// ---------- 云朵 ----------
function makeCloud() {
  const c = document.createElement('div');
  c.className = 'cloud';
  const w = 120 + Math.random() * 140;
  c.style.width = w + 'px';
  c.style.height = w * 0.35 + 'px';
  c.style.top = (5 + Math.random() * 35) + 'vh';
  c.style.left = '-30vw';
  const dur = 40 + Math.random() * 50;
  c.style.animation = `drift ${dur}s linear infinite`;
  c.style.animationDelay = (-Math.random() * dur) + 's';
  document.body.appendChild(c);
}
for (let i = 0; i < 4; i++) makeCloud();

// ---------- 泡泡 ----------
const faces = ['👶','🐯','🐰','🐻','🐼','🐸','🐵','🐷','⭐','🌸','🐠','🦄','🐥','🍓','🚗'];
const colors = [
  'rgba(255,150,190,.55)', 'rgba(150,200,255,.55)', 'rgba(255,210,120,.55)',
  'rgba(160,230,180,.55)', 'rgba(215,170,255,.55)', 'rgba(140,220,235,.55)'
];
const praises = ['真棒！','哇～','好耶！','啵！','厉害！','嘻嘻','太棒啦','再来一个！'];

function spawnBubble() {
  if (document.hidden || paused || gameOver) return;
  const b = document.createElement('div');
  b.className = 'bubble';
  // 泡泡大小跟着屏幕走，手机平板都好戳
  const base = Math.min(window.innerWidth, window.innerHeight);
  const size = Math.max(80, base * (0.10 + Math.random() * 0.09));
  b.style.width = b.style.height = size + 'px';
  b.style.left = (5 + Math.random() * 85) + 'vw';
  b.style.bottom = '-220px';
  b.style.background += ', radial-gradient(circle, ' + colors[Math.floor(Math.random()*colors.length)] + ' 0 70%)';
  b.style.animationDuration = (12 + Math.random() * 8) + 's';
  b.style.setProperty('--sway', (Math.random()*60-30) + 'px');

  const f = document.createElement('div');
  f.className = 'face';
  f.style.fontSize = size * 0.5 + 'px';
  f.textContent = faces[Math.floor(Math.random()*faces.length)];
  b.appendChild(f);

  // pointerdown：手指一碰就爆，零延迟
  b.addEventListener('pointerdown', e => { e.stopPropagation(); popBubble(b); });
  setTimeout(() => b.remove(), parseFloat(b.style.animationDuration) * 1000 + 500);
  document.body.appendChild(b);
}

function popBubble(b) {
  if (b.classList.contains('pop')) return;
  b.classList.add('pop');
  const r = b.getBoundingClientRect();
  const cx = r.left + r.width/2, cy = r.top + r.height/2;

  // 星星碎片
  for (let i = 0; i < 10; i++) {
    const s = document.createElement('div');
    s.className = 'spark';
    s.textContent = ['✨','⭐','💫','🌟','🌸'][i % 5];
    s.style.fontSize = Math.max(22, r.width * 0.18) + 'px';
    const ang = Math.random() * Math.PI * 2;
    const dist = r.width * 0.5 + 30 + Math.random() * 50;
    s.style.left = cx + 'px'; s.style.top = cy + 'px';
    s.style.setProperty('--dx', Math.cos(ang)*dist + 'px');
    s.style.setProperty('--dy', Math.sin(ang)*dist + 'px');
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 900);
  }

  // 鼓励词
  const p = document.createElement('div');
  p.className = 'praise';
  p.textContent = praises[Math.floor(Math.random()*praises.length)];
  p.style.fontSize = Math.max(28, r.width * 0.32) + 'px';
  p.style.left = cx + 'px'; p.style.top = (cy - r.width*0.3) + 'px';
  document.body.appendChild(p);
  setTimeout(() => p.remove(), 1200);

  // 计数 + 跳动
  score++;
  scoreEl.textContent = score;
  scorePill.classList.remove('bump');
  void scorePill.offsetWidth;           // 重启动画
  scorePill.classList.add('bump');

  playPop();
  vibrate(25);
  setTimeout(() => b.remove(), 350);
}

// 点空白处：冒涟漪 + 小泡泡 + 音效，怎么点都有反应
document.addEventListener('pointerdown', e => {
  if (!started || paused || gameOver) return;
  if (e.target.closest('#hud') || e.target.closest('#start')) return;

  // 涟漪
  const rip = document.createElement('div');
  const rs = 90 + Math.random() * 40;
  rip.className = 'ripple';
  rip.style.width = rip.style.height = rs + 'px';
  rip.style.left = (e.clientX - rs/2) + 'px';
  rip.style.top = (e.clientY - rs/2) + 'px';
  document.body.appendChild(rip);
  setTimeout(() => rip.remove(), 550);

  // 冒出一个小泡泡原地爆开
  const b = document.createElement('div');
  b.className = 'bubble';
  const size = 70 + Math.random() * 50;
  b.style.width = b.style.height = size + 'px';
  b.style.left = (e.clientX - size/2) + 'px';
  b.style.top = (e.clientY - size/2) + 'px';
  b.style.background += ', radial-gradient(circle, ' + colors[Math.floor(Math.random()*colors.length)] + ' 0 70%)';
  b.style.animation = 'pop .4s ease-out forwards';
  b.style.pointerEvents = 'none';
  document.body.appendChild(b);
  playBlip();
  vibrate(10);
  setTimeout(() => b.remove(), 450);
});

function vibrate(ms) { if (navigator.vibrate) try { navigator.vibrate(ms); } catch(e){} }

// ---------- 音效（本地合成，无需联网） ----------
let audioCtx = null;
function initAudio() {
  try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}

function playPop() {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  // 上滑的"啵～"
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(400 + Math.random()*300, t);
  o.frequency.exponentialRampToValueAtTime(1200 + Math.random()*500, t + 0.06);
  g.gain.setValueAtTime(0.35, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(t); o.stop(t + 0.2);
  // 短促的低频"啵"
  const o2 = audioCtx.createOscillator(), g2 = audioCtx.createGain();
  o2.type = 'triangle';
  o2.frequency.setValueAtTime(180, t);
  g2.gain.setValueAtTime(0.3, t);
  g2.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
  o2.connect(g2); g2.connect(audioCtx.destination);
  o2.start(t); o2.stop(t + 0.12);
  // 叮铃铃的小琶音，像得奖励
  [880, 1174.7, 1568].forEach((f, i) => {
    const o3 = audioCtx.createOscillator(), g3 = audioCtx.createGain();
    o3.type = 'sine'; o3.frequency.value = f;
    const tt = t + 0.05 + i * 0.06;
    g3.gain.setValueAtTime(0.12, tt);
    g3.gain.exponentialRampToValueAtTime(0.001, tt + 0.25);
    o3.connect(g3); g3.connect(audioCtx.destination);
    o3.start(tt); o3.stop(tt + 0.28);
  });
}

function playBlip() {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(600 + Math.random()*400, t);
  g.gain.setValueAtTime(0.15, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(t); o.stop(t + 0.14);
}

// ---------- 背景音乐：轻柔摇篮曲（五声音阶循环） ----------
const melodyNotes = [
  'E5','G5','A5','G5', 'E5','D5','C5','D5',
  'E5','G5','A5','C6', 'A5','G5','E5','G5',
  'A5','G5','E5','D5', 'C5','D5','E5','G5',
  'E5','D5','C5','A4', 'C5','C5','C5','C5'
];
const noteFreq = { A4:440, C5:523.25, D5:587.33, E5:659.25, G5:783.99, A5:880, C6:1046.5 };
const bassNotes = ['C3','C3','F3','G3', 'C3','C3','F3','G3'];
const bassFreq = { C3:130.81, F3:174.61, G3:196 };
let musicOn = true, musicStep = 0, musicTimer = null;

function playMusicNote(freq, vol, dur) {
  if (!audioCtx || !freq) return;
  const t = audioCtx.currentTime;
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = 'sine'; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol, t + 0.08);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(t); o.stop(t + dur + 0.1);
}

function startMusic() {
  if (!audioCtx) return;
  const STEP = 0.62;   // 每个音 0.62 秒，慢悠悠的
  musicTimer = setInterval(() => {
    if (!musicOn || document.hidden || paused || gameOver) return;
    // 旋律
    const n = melodyNotes[musicStep % melodyNotes.length];
    playMusicNote(noteFreq[n], 0.055, 1.4);
    // 低音每 4 步一个
    if (musicStep % 4 === 0) {
      const bn = bassNotes[Math.floor(musicStep / 4) % bassNotes.length];
      playMusicNote(bassFreq[bn], 0.05, 2.2);
    }
    musicStep++;
  }, STEP * 1000);
}

// 音乐开关
const musicBtn = document.getElementById('musicBtn');
musicBtn.addEventListener('pointerdown', () => {
  musicOn = !musicOn;
  musicBtn.textContent = musicOn ? '🎵 开' : '🎵 关';
  if (musicOn && audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
});

// 回到页面时恢复声音上下文
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
});
</script>
</body>
</html>
